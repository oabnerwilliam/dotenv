<!doctype html>

<head>

<style>
body{margin:0;background:#0B0D10}
button,select,input{font:inherit}
button{cursor:pointer}
input::placeholder{color:#8B98A8;opacity:1}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
.btn-reservar:hover{background:#4ADE80 !important;color:#0B0D10 !important}
.novo-livre:hover{color:#4ADE80 !important;border-color:#4ADE80 !important}
.novo-reservado:hover{color:#60A5FA !important;border-color:#60A5FA !important}
.novo-uso:hover{color:#F87171 !important;border-color:#F87171 !important}

.card-reservado:hover{border-color:#60A5FA !important}
.card-uso:hover{border-color:#F87171 !important}
.card-bloqueado:hover{border-color:#FB923C !important}
.ghost:hover{background:#1A2028 !important}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #BEF264;outline-offset:2px}
a{color:inherit;text-decoration:none}
.btn-acc:hover{background:rgba(190,242,100,.12) !important}
.btn-green:hover{background:#4ADE80 !important;color:#0B0D10 !important}
.btn-orange:hover{background:#FB923C !important;color:#0B0D10 !important}
.btn-ghost:hover{background:#1A2028 !important}
.nav-i:hover{background:#161B22 !important}
.row-h:hover{background:#12161B}
textarea::placeholder{color:#8B98A8;opacity:1}
a{color:inherit;text-decoration:none}
.btn-acc:hover{background:rgba(190,242,100,.12) !important}
.btn-green:hover{background:#4ADE80 !important;color:#0B0D10 !important}
.btn-orange:hover{background:#FB923C !important;color:#0B0D10 !important}
.btn-ghost:hover{background:#1A2028 !important}
.nav-i:hover{background:#161B22 !important}
.row-h:hover{background:#12161B}
.sk{background:#1B222B;border-radius:4px;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.card-link::after{content:"";position:absolute;inset:0;border-radius:8px}
.card-link:focus-visible{outline:none}
.env-card{cursor:pointer;transition:box-shadow .15s}
.env-card:hover,.env-card:focus-within{box-shadow:0 0 0 1px rgba(255,255,255,.16)}
textarea::placeholder{color:#8B98A8;opacity:1}
</style>

</head>

nter,system-ui,sans-serif"></div><a class="btn-ghost" href="App-Board.html" style="height:48px;padding:0 18px;border-radius:6px;border:1px solid #2F3944;background:transparent;color:#B4C0CE;font:600 14px Inter,system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;white-space:nowrap;flex:1 1 auto;">Entrar</a><div style="font:14px Inter,system-ui,sans-serif;color:#8B98A8;display:flex;flex-wrap:wrap;gap:6px 16px"><a href="App-Onb-Empresa.html" style="color:#BEF264;text-decoration:underline;min-height:44px;display:inline-flex;align-items:center">Criar conta da equipe</a><span style="min-height:44px;display:inline-flex;align-items:center;text-decoration:underline">Esqueci a senha</span></div></div>

</html>
