<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App — criar equipe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D10}
button,select,input{font:inherit}
button{cursor:pointer}
input::placeholder{color:#8B98A8;opacity:1}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
.btn-reservar:hover{background:#4ADE80 !important;color:#0B0D10 !important}
.novo-livre:hover{color:#4ADE80 !important;border-color:#4ADE80 !important}
.novo-reservado:hover{color:#60A5FA !important;border-color:#60A5FA !important}
.novo-uso:hover{color:#F87171 !important;border-color:#F87171 !important}
.novo-bloqueado:hover{color:#FB923C !important;border-color:#FB923C !important}
.card-livre:hover{border-color:#4ADE80 !important}
.card-reservado:hover{border-color:#60A5FA !important}
.card-uso:hover{border-color:#F87171 !important}
.card-bloqueado:hover{border-color:#FB923C !important}
.ghost:hover{background:#1A2028 !important}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #BEF264;outline-offset:2px}
a{color:inherit;text-decoration:none}
.btn-acc:hover{background:rgba(190,242,100,.12) !important}
.btn-green:hover{background:#4ADE80 !important;color:#0B0D10 !important}
.btn-orange:hover{background:#FB923C !important;color:#0B0D10 !important}
.btn-ghost:hover{background:#1A2028 !important}
.nav-i:hover{background:#161B22 !important}
.row-h:hover{background:#12161B}
textarea::placeholder{color:#8B98A8;opacity:1}
a{color:inherit;text-decoration:none}
.btn-acc:hover{background:rgba(190,242,100,.12) !important}
.btn-green:hover{background:#4ADE80 !important;color:#0B0D10 !important}
.btn-orange:hover{background:#FB923C !important;color:#0B0D10 !important}
.btn-ghost:hover{background:#1A2028 !important}
.nav-i:hover{background:#161B22 !important}
.row-h:hover{background:#12161B}
.sk{background:#1B222B;border-radius:4px;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.card-link::after{content:"";position:absolute;inset:0;border-radius:8px}
.card-link:focus-visible{outline:none}
.env-card{cursor:pointer;transition:box-shadow .15s}
.env-card:hover,.env-card:focus-within{box-shadow:0 0 0 1px rgba(255,255,255,.16)}
textarea::placeholder{color:#8B98A8;opacity:1}
</style>

</head>
<body style="margin:0">


<div style="position:relative;min-height:980px;background:#0B0D10;font-family:Inter,system-ui,sans-serif;color:#E6EDF3;display:flex;flex-direction:column">
<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:50;opacity:1;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0,rgba(255,255,255,.022) 1px,transparent 1px,transparent 3px)"></div>
<div aria-hidden="true" style="height:2px;background:linear-gradient(90deg,transparent,#BEF264,transparent);opacity:.55"></div>
<header style="padding:20px 24px"><span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:21px;font-weight:700;color:#E6EDF3">.env<span class="cur" aria-hidden="true" style="color:#BEF264">_</span></span></header>
<main style="flex:1;display:flex;flex-direction:column;align-items:center;gap:28px;padding:32px 24px 64px;box-sizing:border-box">
<ol aria-label="Etapas da configuração" style="list-style:none;margin:0;padding:0;display:flex;align-items:center;gap:12px;width:100%;max-width:560px"><li aria-current="step" style="display:flex;align-items:center;gap:10px;font:600 14px Inter,system-ui,sans-serif;color:#BEF264"><span aria-hidden="true" style="width:32px;height:32px;border-radius:6px;border:1px solid #BEF264;display:flex;align-items:center;justify-content:center;color:#BEF264"><span style="font:600 13px 'JetBrains Mono',ui-monospace,monospace">1</span></span>Equipe</li><li aria-hidden="true" style="flex:1 1 24px;min-width:24px;height:1px;background:#2F3944"></li><li  style="display:flex;align-items:center;gap:10px;font:600 14px Inter,system-ui,sans-serif;color:#8B98A8"><span aria-hidden="true" style="width:32px;height:32px;border-radius:6px;border:1px solid #8B98A8;display:flex;align-items:center;justify-content:center;color:#8B98A8"><span style="font:600 13px 'JetBrains Mono',ui-monospace,monospace">2</span></span>GitHub</li><li aria-hidden="true" style="flex:1 1 24px;min-width:24px;height:1px;background:#2F3944"></li><li  style="display:flex;align-items:center;gap:10px;font:600 14px Inter,system-ui,sans-serif;color:#8B98A8"><span aria-hidden="true" style="width:32px;height:32px;border-radius:6px;border:1px solid #8B98A8;display:flex;align-items:center;justify-content:center;color:#8B98A8"><span style="font:600 13px 'JetBrains Mono',ui-monospace,monospace">3</span></span>Jira</li></ol>
<div style="width:100%;max-width:560px;background:#0F1216;border:1px solid #232A33;border-radius:12px;padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px"><div style="display:flex;flex-direction:column;gap:8px"><h1 style="margin:0;font:600 28px Inter,system-ui,sans-serif;letter-spacing:-.02em;color:#E6EDF3">Crie a equipe</h1><p style="margin:0;font:15px Inter,system-ui,sans-serif;color:#B4C0CE;line-height:1.6">A equipe reúne os projetos e as pessoas que compartilham os mesmos ambientes.</p></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><label for="o-nome" style="font:600 13px Inter,system-ui,sans-serif;color:#B4C0CE">Nome da equipe</label><input id="o-nome" value="Acme" placeholder="" style="height:48px;padding:0 12px;width:100%;box-sizing:border-box;background:#0F1216;border:1px solid #2F3944;border-radius:6px;color:#E6EDF3;font:400 14px Inter,system-ui,sans-serif"></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><label for="o-slug" style="font:600 13px Inter,system-ui,sans-serif;color:#B4C0CE">Endereço</label><input id="o-slug" value="acme" placeholder="" style="height:48px;padding:0 12px;width:100%;box-sizing:border-box;background:#0F1216;border:1px solid #2F3944;border-radius:6px;color:#E6EDF3;font:500 14px 'JetBrains Mono',ui-monospace,monospace"><span style="font:12.5px Inter,system-ui,sans-serif;color:#8B98A8;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center">Fica assim: <span style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.93em">env.app/acme</span></span></div><div style="display:flex;flex-direction:column;gap:6px;min-width:0"><label for="o-proj" style="font:600 13px Inter,system-ui,sans-serif;color:#B4C0CE">Primeiro projeto</label><input id="o-proj" value="Atlas" placeholder="" style="height:48px;padding:0 12px;width:100%;box-sizing:border-box;background:#0F1216;border:1px solid #2F3944;border-radius:6px;color:#E6EDF3;font:400 14px Inter,system-ui,sans-serif"><span style="font:12.5px Inter,system-ui,sans-serif;color:#8B98A8;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center">Você pode adicionar outros depois, em Configurações</span></div><div style="display:flex;flex-wrap:wrap;gap:8px;padding-top:4px"><a class="btn-acc" href="App-Onb-GitHub.html" style="height:48px;padding:0 18px;border-radius:6px;border:1px solid #BEF264;background:transparent;color:#BEF264;font:600 14px Inter,system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;white-space:nowrap;flex:1 1 auto;"><span aria-hidden="true" style="font-family:'JetBrains Mono',ui-monospace,monospace">&gt;</span> Continuar</a><a class="btn-ghost" href="App-Login.html" style="height:48px;padding:0 18px;border-radius:6px;border:1px solid #2F3944;background:transparent;color:#B4C0CE;font:600 14px Inter,system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;white-space:nowrap;">Voltar</a></div></div>
</main></div>

</body>
</html>
